# Render Blueprint for the free plan: one web service running both the API and the job worker.
# Deploy: Render dashboard → New → Blueprint → pick this repo. Fill the `sync: false` values when
# prompted (see README → Deployment). Secrets marked generateValue are created by Render.
#
# Free web services sleep after 15 idle minutes and take about a minute to wake; there are no free
# background workers and no pre-deploy step, hence RUN_WORKER_IN_API and docker-start.sh. On a
# paid plan, run `node dist/worker.js` as a separate worker service instead (README → Scaling up).

services:
  - type: web
    name: certdrop-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Applies pending migrations, then starts the API.
    dockerCommand: sh docker-start.sh
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # The Vercel URL, e.g. https://certdrop.vercel.app (verify links and QR codes point here).
      - key: PUBLIC_APP_URL
        sync: false
      # Vercel (rewrite) → Render's proxy → API.
      - key: TRUST_PROXY_HOPS
        value: '2'
      - key: RUN_WORKER_IN_API
        value: 'true'
      # 0.1 CPU: render one certificate at a time so the API stays responsive.
      - key: GENERATE_CONCURRENCY
        value: '1'

      # Neon: use the direct (non-pooled) connection string. pg-boss needs session features
      # that PgBouncer's transaction pooling doesn't provide.
      - key: DATABASE_URL
        sync: false

      # Cloudflare R2
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'false'

      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true

      # Gmail API (no domain needed). Get the refresh token with
      #   pnpm --filter @certdrop/api gmail:token
      - key: EMAIL_PROVIDER
        value: gmail
      # The Gmail address itself.
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: EMAIL_RATE_PER_SECOND
        value: '1'

      - key: TURNSTILE_SECRET_KEY
        sync: false

      # Gmail allows about 500 recipients a day, so keep each organizer well under it.
      - key: BATCHES_PER_DAY
        value: '3'
